name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check release notes
        run: make check-release-notes

      # 未提供 Configs/Local.xcconfig，使用临时签名构建与测试。
      - name: Test
        run: make test
