name: Folita

options:
  bundleIdPrefix: app.folita
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_HARDENED_RUNTIME: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    minorVersion: 3.1.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    minorVersion: 2.10.0

targets:
  Folita:
    type: application
    platform: macOS
    sources:
      - path: Folita
      # 默认（狐狸）图标的 Icon Composer 文档，系统据此施加 macOS 蒙层与玻璃效果。
      - path: design/app-icons/fox.icon
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    configFiles:
      Debug: Configs/Signing.xcconfig
      Release: Configs/Signing.xcconfig
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Folita/Folita.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: fox
        INFOPLIST_FILE: Folita/Info.plist
        # Sparkle 更新包签名的 EdDSA 公钥（由 generate_keys 生成，可公开）；为空时应用内更新保持禁用。
        SPARKLE_PUBLIC_ED_KEY: ""
        PRODUCT_BUNDLE_IDENTIFIER: app.folita.Folita
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Folita
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # 无 Dock 图标：应用只以菜单栏图标常驻，见 docs/adr/0005-menu-bar-only-app.md。
        INFOPLIST_KEY_LSUIElement: YES

  FolitaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FolitaTests
    dependencies:
      - target: Folita
    configFiles:
      Debug: Configs/Signing.xcconfig
      Release: Configs/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.folita.FolitaTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Folita:
    build:
      targets:
        Folita: all
        FolitaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FolitaTests
